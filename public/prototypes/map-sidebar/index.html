        }

          @apply absolute rounded-full border-[3px] border-white bg-red-500/80;
          box-shadow: 0 1px 5px #00000020;
        }
        .alert-marker.previous {
          @apply bg-orange-400/80;
        }

        .control:hover {
          background: #f5f3ff;
          color: #5b21b6;
        }
        .control.primary:hover {
          background: #5b21b6;
          color: white;
        }
        .icon-button:hover {
          background: #f5f3ff;
          color: #5b21b6;
        }
        .alert-marker:hover {
          outline: 3px solid #6d28d9;
          outline-offset: 3px;
        }
      }
      @media (max-width: 639px) {
        .sidebar {
          top: auto;
          width: 100%;
          height: var(--drawer-height, 50dvh);
          border-radius: 20px 20px 0 0;

          padding: 20px;
        }

          font-size: 22px;
        }
        .rail {
          right: 10px;
          top: 10px;
        }

          display: none !important;
        }
        .toolbar-controls {
          left: 12px !important;
          top: 68px;
        }
        .toolbar-controls:has([aria-expanded="true"]) {
          top: 16px;
        }

        output {
          left: 12px !important;
        }

          left: 50% !important;
          top: auto !important;
          bottom: 16px;

        }

   <button class="sm:hidden flex justify-center h-8 w-full items-center touch-none" aria-label="Resize sidebar" role="separator" aria-orientation="horizontal" :aria-valuenow="drawerHeight" :aria-valuemin="innerHeight*.25" :aria-valuemax="innerHeight*.9" @pointerdown="beginResize" @pointermove="resizeDrawer" @pointerup="endResize" @pointercancel="endResize" @keydown="resizeKey"><span class="h-1.5 w-12 rounded-full bg-gray-300"></span></button>
   <button class="icon-button absolute right-6 top-6 !rounded-full !bg-white/90" aria-label="Hide panel" @click="toggle"><Icon name="X" :size="18"/></button>
   <CurrentPanel v-if="!selected" :alerts-statistics="statistics" :initial-range="[dateFrom,dateTo]" @date-range-changed="dateFrom=$event[0];dateTo=$event[1]" @download="download"/>
   <section v-else class="card"><button class="text-violet-800 text-sm flex gap-2 items-center min-h-11 mb-2" @click="selected=null"><Icon name="ArrowLeft" :size="16"/>Overview</button><h2>Synthetic alert {{selected.id}}</h2><dl class="text-sm mt-5 space-y-4"><div><dt class="text-gray-500 mb-1">Detection date</dt><dd>{{selected.recent?'15 October 2026':'15 August 2026'}}</dd></div><div><dt class="text-gray-500 mb-1">Territory</dt><dd>Test Territory 130</dd></div><div><dt class="text-gray-500 mb-1">Area</dt><dd>0.42 hectares</dd></div></dl></section>
   
  </aside>
  <div class="absolute right-2.5" :style="{bottom:open&&isMobile?(drawerHeight+30)+'px':'30px',zIndex:15}">
   <button v-if="!legendOpen" class="icon-button !bg-violet-700 !text-white" aria-label="Map legend" @click="legendOpen=true"><Icon name="Layers"/></button>
   <div v-else class="bg-white p-4 rounded-lg shadow-lg w-64"><div class="flex justify-between items-center"><h2 class="text-lg font-semibold">Map legend</h2><button class="icon-button" aria-label="Close map legend" @click="legendOpen=false"><Icon name="X" :size="16"/></button></div><label class="flex gap-3 py-3 items-center text-sm"><input type="checkbox" v-model="showRecent"><span class="w-3 h-3 bg-red-500 rounded-full"></span>Most recent alerts</label><label class="flex gap-3 py-3 items-center text-sm"><input type="checkbox" v-model="showPrevious"><span class="w-3 h-3 bg-orange-400 rounded-full"></span>Previous alerts</label></div>
  </div>
  <div class="absolute bottom-0 right-0 bg-white/85 px-2 py-1 text-[10px] text-gray-600"><a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a></div>
  <output class="absolute bottom-1 left-4 bg-white/85 px-2 py-1 text-[10px] tabular-nums text-gray-600" :style="{left:open?'416px':'16px'}">Zoom {{zoom}} · Offset {{Math.round(pan.x)}}, {{Math.round(pan.y)}}</output>
  <div v-if="toast" role="status" class="absolute top-20 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-lg text-sm" style="z-index:30" @click="toast=''">{{toast}}</div>
 </section>`,
        });
        app.config.globalProperties.$t = (key) => translations[key] || key;
        app.config.globalProperties.$n = (value) =>
          new Intl.NumberFormat("en").format(value);
        app.mount("#stage");
      };
      const stage = document.getElementById("stage");
      const picker = document.querySelector(".proto-picker");
      const highlight = picker.querySelector(".proto-picker-highlight");
      const items = [
        ...picker.querySelectorAll(
          ".proto-picker-item:not(.proto-picker-replay)",
        ),
      ];
      const replay = picker.querySelector(".proto-picker-replay");
      let current = 0;
      const moveHighlight = () => {
        const el = items[current];
        highlight.style.width = el.offsetWidth + "px";
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      };
      const revisedFrame = document.getElementById("revised-prototype");
      const mount = (i) => {
        if (app) {
          app.unmount();
          app = null;
        }
        stage.style.display = i === 0 ? "none" : "";
        revisedFrame.hidden = i !== 0;
        if (i === 0) revisedFrame.src = "round-two.html?embedded=1";
        else {
          revisedFrame.removeAttribute("src");
          mountVariant(panels[i]);
        }
      };
      const setActive = (i) => {
        if (i < 0 || i >= panels.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute("data-active", j === i);
          if (j === i) el.setAttribute("aria-current", "true");
          else el.removeAttribute("aria-current");
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set("v", i + 1);
        history.replaceState(null, "", url);
        mount(i);
      };
      items.forEach((el, i) =>
        el.addEventListener("click", () => setActive(i)),
      );
      window.addEventListener("resize", moveHighlight);
      const switchWithKeyboard = (e) => {
        if (
          /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) ||
          e.target.isContentEditable ||
          e.target.closest("[role=slider],[role=separator]")
        )
          return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= panels.length) setActive(num - 1);
        else if (e.key === "ArrowRight")
          setActive((current + 1) % panels.length);
        else if (e.key === "ArrowLeft")
          setActive((current - 1 + panels.length) % panels.length);
        else if (e.key === "r" || e.key === "R") mount(current);
      };
      document.addEventListener("keydown", switchWithKeyboard);
      revisedFrame.addEventListener("load", () =>
        revisedFrame.contentDocument?.addEventListener(
          "keydown",
          switchWithKeyboard,
        ),
      );
      const initial = parseInt(
        new URLSearchParams(location.search).get("v"),
        10,
      );
      setActive(initial >= 1 && initial <= panels.length ? initial - 1 : 0);
      requestAnimationFrame(() =>
        requestAnimationFrame(() => picker.setAttribute("data-ready", "")),
      );
    </script>
  </body>
</html>
